# Этап 7 (инфраструктура): вместо монтирования всего репозитория `.:/app`
# (перекрывал код в образе, тянул секреты/мусор внутрь) — точечные тома:
#   ./data            → рантайм-данные бота (история, трекинги, users, results)
#   ./data/.env       → конфигурация/секреты read-only (в образ не печатается)
# env_file на хосте по-прежнему читает compose; внутри контейнера config.py
# использует ENV_FILE=/app/data/.env, чтобы админская запись значений
# (MAX_CONCURRENT_PINGS, PROXY_URL) попадала в тот же файл.
services:
  ping-bot:
    build: .
    container_name: telegram_ping_bot
    restart: always
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      ENV_FILE: /app/data/.env
    volumes:
      - ./data:/app/data
      - ./data/.env:/app/data/.env:ro
